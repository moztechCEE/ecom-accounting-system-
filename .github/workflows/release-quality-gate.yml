name: Release Quality Gate

on:
  workflow_call:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma loads its configuration while generating and validating the
      # client. CI never connects to this placeholder database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate Copilot guide coverage and reviewed sources
        run: node scripts/dev/generate-copilot-knowledge.cjs --check

      - name: Generate and validate Prisma client
        working-directory: backend
        run: |
          npm run prisma:generate
          npx prisma validate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Validate production entrypoints
        working-directory: backend
        run: |
          node --check scripts/database-url.js
          node --check scripts/migrate-prod.js
          node --check scripts/start-prod.js

      - name: Run backend unit tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
